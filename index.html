<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d9488">
    <title>Ritma Care Link - Layanan Kesehatan Mahasantri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    screens: { 'xs': '380px' },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Awesome 6 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN for Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- html2pdf.js CDN for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Font: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            overflow-x: hidden;
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-scrollbar { -webkit-overflow-scrolling: touch; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .chart-container {
            position: relative;
            width: 100%;
            height: 220px;
            max-height: 260px;
        }
        @media (min-width: 640px) {
            .chart-container { height: 260px; }
        }

        input, select, textarea {
            font-size: 16px !important;
        }
        @media (min-width: 640px) {
            input, select, textarea {
                font-size: 0.875rem !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white dark:bg-slate-900 dark:text-slate-100">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcLVGst8QLJDR9el4NUi-EkTmzHOSOp1rnbH-k3f8Sf3e4dYQUcxEvpiTTYd5-jiRU-g/exec";

        const getSectorByBuilding = (buildingName) => {
            if (buildingName === "Gedung C") return "Putri";
            return "Putra";
        };

        const getInitials = (name = "") => {
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return (parts[0][0] + parts[1][0]).toUpperCase();
        };

        const INITIAL_ROOMS = [];
        const INITIAL_SEBAT = [];

        const INITIAL_STAFF = [
            { id: "STF-153", name: "M. Nur Fami Lubis", role: "Ketua ORKES / Poskes", shift: "Shift Pagi & Malam", sector: "Putra", phone: "0812-3456-7890", avatarBg: "bg-teal-600", status: "Bertugas" },
            { id: "STF-560", name: "Kiromim Baroroh", role: "Anggota Tim Cek Kamar", shift: "Shift Pagi (07.00 - 15.00)", sector: "Putra", phone: "0813-9876-5432", avatarBg: "bg-teal-500", status: "Bertugas" },
            { id: "STF-881", name: "Siti Rahmawati", role: "Apoteker & Tim Poskes Putri", shift: "Shift Pagi (07.00 - 15.00)", sector: "Putri", phone: "0821-4455-6677", avatarBg: "bg-pink-600", status: "Bertugas" }
        ];

        const INITIAL_REQUESTS = [];

        function downloadCSV(filename, csvData) {
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function App() {
            const [userRole, setUserRole] = useState(null);
            const [currentMahasantri, setCurrentMahasantri] = useState(null);
            const [currentView, setCurrentView] = useState("dashboard");
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const [isDarkMode, setIsDarkMode] = useState(() => {
                const savedMode = localStorage.getItem('ritma_dark_mode');
                if (savedMode !== null) return JSON.parse(savedMode);
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            });
            
            const [rooms, setRooms] = useState(() => {
                const saved = localStorage.getItem('ritma_rooms_26_27_empty');
                return saved ? JSON.parse(saved) : INITIAL_ROOMS;
            });
            const [medicines, setMedicines] = useState(() => {
                const saved = localStorage.getItem('ritma_medicines_26_27_empty');
                return saved ? JSON.parse(saved) : INITIAL_SEBAT;
            });
            const [staff, setStaff] = useState(() => {
                const saved = localStorage.getItem('ritma_staff_26_27');
                return saved ? JSON.parse(saved) : INITIAL_STAFF;
            });
            const [requests, setRequests] = useState(() => {
                const saved = localStorage.getItem('ritma_requests_26_27');
                return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
            });
            const [toast, setToast] = useState(null);

            useEffect(() => {
                localStorage.setItem('ritma_rooms_26_27_empty', JSON.stringify(rooms));
            }, [rooms]);

            useEffect(() => {
                localStorage.setItem('ritma_medicines_26_27_empty', JSON.stringify(medicines));
            }, [medicines]);

            useEffect(() => {
                localStorage.setItem('ritma_staff_26_27', JSON.stringify(staff));
            }, [staff]);

            useEffect(() => {
                localStorage.setItem('ritma_requests_26_27', JSON.stringify(requests));
            }, [requests]);

            useEffect(() => {
                localStorage.setItem('ritma_dark_mode', JSON.stringify(isDarkMode));
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const toggleDarkMode = () => {
                setIsDarkMode(prev => {
                    const nextMode = !prev;
                    if (nextMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    localStorage.setItem('ritma_dark_mode', JSON.stringify(nextMode));
                    return nextMode;
                });
                showToast(`Mode ${!isDarkMode ? 'Gelap' : 'Terang'} Diaktifkan`, "info");
            };

            const showToast = (message, type = "success") => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const syncWithGoogleSheets = async (actionType = "getAll", extraPayload = null) => {
                setIsSyncing(true);
                try {
                    let url = APPS_SCRIPT_URL;
                    let options = { method: "GET", mode: "cors" };

                    if (extraPayload) {
                        options = {
                            method: "POST",
                            mode: "cors",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify(extraPayload)
                        };
                    } else if (actionType !== "getAll") {
                        url += `?action=${actionType}`;
                    }

                    const res = await fetch(url, options);
                    const json = await res.json();

                    if (json && json.status === "success") {
                        showToast("Sinkronisasi Google Sheets Berhasil!", "success");
                        if (json.gedung) {
                            // Map incoming sheet data into rooms structure if available
                        }
                    } else {
                        showToast("Tersambung ke Apps Script.", "info");
                    }
                } catch (err) {
                    console.warn("Apps Script sync note:", err);
                    showToast("Tersambung ke Apps Script (Mode Offline / CORS)", "info");
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleResetAllToHealthy = () => {
                const healthyRooms = rooms.map(room => ({
                    ...room,
                    occupants: room.occupants.map(mhs => ({
                        ...mhs,
                        status: "Sehat",
                        symptom: "-"
                    }))
                }));
                setRooms(healthyRooms);
                syncWithGoogleSheets("setAllHealthy");
                showToast("Seluruh mahasantri (Gedung B, C, D) telah diset ke status Sehat!", "success");
            };

            const findMahasantriByNim = (searchNim) => {
                const cleanNim = String(searchNim).trim();
                for (const room of rooms) {
                    const found = room.occupants.find(o => String(o.nim).trim() === cleanNim);
                    if (found) {
                        return {
                            fullName: found.name,
                            nim: found.nim,
                            building: room.building,
                            roomNo: room.roomNo,
                            sector: room.sector,
                            semester: found.semester,
                            major: found.major,
                            status: found.status || "Sehat",
                            symptom: found.symptom || "-"
                        };
                    }
                }
                return null;
            };

            const handleNimLogin = (nimToLogin) => {
                const profile = findMahasantriByNim(nimToLogin);
                if (profile) {
                    setCurrentMahasantri(profile);
                    setUserRole("mahasantri");
                    showToast(`Selamat datang kembali, ${profile.fullName}!`, "success");
                    return { success: true };
                } else {
                    return { 
                        success: false, 
                        message: `NIM "${nimToLogin}" belum terdaftar. Silakan pilih tab 'Daftar Akun Baru' untuk registrasi.` 
                    };
                }
            };

            const handleRegisterMahasantri = (formData) => {
                const existing = findMahasantriByNim(formData.nim);
                if (existing) {
                    setCurrentMahasantri(existing);
                    setUserRole("mahasantri");
                    showToast(`NIM ${formData.nim} sudah terdaftar sebelumnya. Selamat datang kembali!`, "info");
                    return;
                }

                setCurrentMahasantri(formData);
                setUserRole("mahasantri");

                const targetRoomId = `RM-${formData.building.replace('Gedung ', '')}${formData.roomNo}`;
                const existingRoom = rooms.find(r => r.id === targetRoomId || (r.building === formData.building && r.roomNo === formData.roomNo));

                const newMhs = {
                    id: `MHS-${Math.floor(100 + Math.random() * 900)}`,
                    nim: formData.nim,
                    name: formData.fullName,
                    major: formData.major,
                    semester: formData.semester,
                    status: formData.status || "Sehat",
                    symptom: formData.symptom || "-"
                };

                if (existingRoom) {
                    const updated = rooms.map(r => r.id === existingRoom.id ? { ...r, occupants: [...r.occupants, newMhs] } : r);
                    setRooms(updated);
                } else {
                    const newRoom = {
                        id: targetRoomId,
                        building: formData.building,
                        roomNo: formData.roomNo,
                        sector: formData.sector,
                        occupants: [newMhs]
                    };
                    setRooms([newRoom, ...rooms]);
                }

                showToast(`Pendaftaran berhasil! Selamat datang ${formData.fullName}.`, "success");
            };

            const handleEditMahasantri = (mhsId, oldRoomId, updatedData, targetBuilding, targetRoomNo, targetSector) => {
                const targetRoomId = `RM-${targetBuilding.replace('Gedung ', '')}${targetRoomNo}`;
                
                if (targetRoomId === oldRoomId) {
                    setRooms(rooms.map(room => {
                        if (room.id === oldRoomId) {
                            return {
                                ...room,
                                occupants: room.occupants.map(m => m.id === mhsId ? { ...m, ...updatedData } : m)
                            };
                        }
                        return room;
                    }));
                } else {
                    let movingMhs = null;
                    const cleanedRooms = rooms.map(room => {
                        if (room.id === oldRoomId) {
                            const found = room.occupants.find(m => m.id === mhsId);
                            if (found) movingMhs = { ...found, ...updatedData };
                            return { ...room, occupants: room.occupants.filter(m => m.id !== mhsId) };
                        }
                        return room;
                    });

                    if (!movingMhs) return;

                    const existingTargetRoom = cleanedRooms.find(r => r.id === targetRoomId || (r.building === targetBuilding && r.roomNo === targetRoomNo));
                    if (existingTargetRoom) {
                        setRooms(cleanedRooms.map(r => r.id === existingTargetRoom.id ? { ...r, occupants: [...r.occupants, movingMhs] } : r));
                    } else {
                        const newRoom = {
                            id: targetRoomId,
                            building: targetBuilding,
                            roomNo: targetRoomNo,
                            sector: targetSector,
                            occupants: [movingMhs]
                        };
                        setRooms([newRoom, ...cleanedRooms]);
                    }
                }
                syncWithGoogleSheets("updateHealthStatus", {
                    action: "updateHealthStatus",
                    nim: updatedData.nim,
                    building: targetBuilding,
                    status: updatedData.status,
                    symptom: updatedData.symptom
                });
                showToast(`Data mahasantri ${updatedData.name} berhasil diperbarui!`, "success");
            };

            const handleDeleteMahasantri = (roomId, mhsId, mhsName) => {
                setRooms(rooms.map(room => {
                    if (room.id === roomId) {
                        return { ...room, occupants: room.occupants.filter(m => m.id !== mhsId) };
                    }
                    return room;
                }).filter(r => r.occupants.length > 0));
                showToast(`Data mahasantri ${mhsName} telah dihapus.`, "info");
            };

            const handleEditMedicine = (updatedMed) => {
                setMedicines(medicines.map(m => m.id === updatedMed.id ? updatedMed : m));
                showToast(`Data obat ${updatedMed.name} berhasil diperbarui!`, "success");
            };

            const handleDeleteMedicine = (medId, medName) => {
                setMedicines(medicines.filter(m => m.id !== medId));
                showToast(`Obat ${medName} berhasil dihapus dari sistem.`, "info");
            };

            const handleEditStaff = (updatedStaff) => {
                setStaff(staff.map(s => s.id === updatedStaff.id ? updatedStaff : s));
                showToast(`Data petugas ${updatedStaff.name} berhasil diperbarui!`, "success");
            };

            const handleDeleteStaff = (staffId, staffName) => {
                setStaff(staff.filter(s => s.id !== staffId));
                showToast(`Petugas ${staffName} berhasil dihapus.`, "info");
            };

            const handleEditRequest = (updatedReq) => {
                setRequests(requests.map(r => r.id === updatedReq.id ? updatedReq : r));
                showToast(`Data permintaan ${updatedReq.id} berhasil diperbarui!`, "success");
            };

            const handleDeleteRequest = (reqId) => {
                setRequests(requests.filter(r => r.id !== reqId));
                showToast(`Permintaan ${reqId} telah dihapus.`, "info");
            };

            const handleAdminLogin = (inputPass) => {
                if (inputPass === "orkes2026") {
                    setUserRole("admin");
                    setCurrentView("dashboard");
                    showToast("Berhasil masuk sebagai Pengurus Admin Poskes", "success");
                    return true;
                } else {
                    return false;
                }
            };

            const handleLogout = () => {
                setUserRole(null);
                setCurrentMahasantri(null);
                setIsDrawerOpen(false);
                showToast("Anda telah keluar.", "info");
            };

            const handleRequestMedicine = (medName, qty, symptom) => {
                if (!currentMahasantri) return;
                const newReq = {
                    id: `REQ-${Math.floor(100 + Math.random() * 900)}`,
                    nim: currentMahasantri.nim,
                    name: currentMahasantri.fullName,
                    building: currentMahasantri.building,
                    roomNo: currentMahasantri.roomNo,
                    sector: currentMahasantri.sector,
                    medicineName: medName,
                    qty: parseInt(qty, 10) || 1,
                    symptom: symptom || "Keluhan kesehatan mahasantri",
                    date: new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    status: "Menunggu"
                };
                setRequests([newReq, ...requests]);
                syncWithGoogleSheets("requestMedicine", { action: "requestMedicine", ...newReq });
                showToast(`Permintaan obat ${medName} terkirim ke Admin!`, "success");
            };

            const handleUpdateRequestStatus = (reqId, newStatus) => {
                const reqItem = requests.find(r => r.id === reqId);
                if (newStatus === "Disetujui" && reqItem) {
                    setMedicines(prevMeds => prevMeds.map(m => {
                        if (m.name.toLowerCase() === reqItem.medicineName.toLowerCase() && m.stock >= reqItem.qty) {
                            return { ...m, stock: m.stock - reqItem.qty };
                        }
                        return m;
                    }));
                }
                setRequests(prev => prev.map(r => r.id === reqId ? { ...r, status: newStatus } : r));
                showToast(`Status permintaan ${reqId} diperbarui menjadi ${newStatus}`);
            };

            if (!userRole) {
                return <AuthContainer 
                            onNimLogin={handleNimLogin}
                            onRegisterMahasantri={handleRegisterMahasantri} 
                            onAdminLogin={handleAdminLogin} 
                            isDarkMode={isDarkMode} 
                            toggleDarkMode={toggleDarkMode} 
                       />;
            }

            if (userRole === "mahasantri") {
                return (
                    <UserPortalLayout 
                        mahasantri={currentMahasantri} 
                        medicines={medicines} 
                        staff={staff} 
                        requests={requests.filter(r => r.nim === currentMahasantri.nim)} 
                        onRequestMedicine={handleRequestMedicine}
                        onLogout={handleLogout}
                        isDarkMode={isDarkMode}
                        toggleDarkMode={toggleDarkMode}
                        toast={toast}
                    />
                );
            }

            return (
                <div className={`min-h-screen flex flex-col pb-20 md:pb-0 transition-colors duration-200 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    <header className={`sticky top-0 z-30 shadow-sm border-b transition-colors duration-200 ${isDarkMode ? 'bg-slate-800/95 border-slate-700 backdrop-blur-md' : 'bg-white/95 border-slate-200 backdrop-blur-md'}`}>
                        <div className="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2.5 sm:gap-3">
                                <button 
                                    onClick={() => setIsDrawerOpen(true)}
                                    className={`w-10 h-10 rounded-xl flex items-center justify-center transition active:scale-95 ${isDarkMode ? 'text-slate-300 hover:bg-slate-700 bg-slate-800' : 'text-slate-600 hover:bg-slate-100 bg-slate-50'}`}
                                    aria-label="Buka Menu Sidebar"
                                    title="Menu">
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white shadow-sm font-bold text-sm">
                                        <i className="fa-solid fa-user-gear"></i>
                                    </div>
                                    <div className="leading-tight">
                                        <div className="flex items-center gap-1.5">
                                            <h1 className="font-bold text-sm sm:text-base">Ritma Care</h1>
                                            <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-500 border border-teal-500/30">ADMIN</span>
                                        </div>
                                        <p className="text-[10px] sm:text-[11px] text-teal-600 dark:text-teal-400 font-semibold truncate max-w-[170px] xs:max-w-none">Gedung B, C & D (2026/2027)</p>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5 sm:gap-2.5">
                                <button 
                                    onClick={() => syncWithGoogleSheets("getAll")}
                                    disabled={isSyncing}
                                    className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-teal-500/10 text-teal-500 hover:bg-teal-500/20 text-xs font-bold transition flex items-center gap-1.5 active:scale-95"
                                    title="Sinkronkan dengan Spreadsheet">
                                    <i className={`fa-solid fa-rotate ${isSyncing ? 'fa-spin' : ''}`}></i>
                                    <span className="hidden md:inline">Sync Sheets</span>
                                </button>

                                {requests.filter(r => r.status === 'Menunggu').length > 0 && (
                                    <button 
                                        onClick={() => setCurrentView("requests")}
                                        className="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-500 border border-amber-500/40 animate-pulse">
                                        <i className="fa-solid fa-bell text-xs"></i>
                                        <span className="hidden xs:inline">{requests.filter(r => r.status === 'Menunggu').length}</span>
                                    </button>
                                )}
                                
                                <button
                                    onClick={toggleDarkMode}
                                    className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm border transition-all active:scale-95 ${isDarkMode ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-amber-50 text-amber-600 border-amber-200'}`}
                                    aria-label="Toggle Mode Gelap">
                                    <i className={`fa-solid ${isDarkMode ? 'fa-sun text-amber-300' : 'fa-moon text-slate-700'}`}></i>
                                </button>

                                <button 
                                    onClick={handleLogout}
                                    className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500/20 text-xs font-bold transition flex items-center gap-1.5 active:scale-95"
                                    title="Keluar">
                                    <i className="fa-solid fa-power-off"></i>
                                    <span className="hidden sm:inline">Keluar</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {isDrawerOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            <div 
                                className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm transition-opacity" 
                                onClick={() => setIsDrawerOpen(false)}></div>

                            <div className={`relative w-[85%] max-w-xs h-full shadow-2xl flex flex-col justify-between z-10 transition-transform duration-300 ${isDarkMode ? 'bg-slate-800 text-slate-100 border-r border-slate-700' : 'bg-white text-slate-800'}`}>
                                <div className="overflow-y-auto custom-scrollbar">
                                    <div className={`p-4 border-b flex justify-between items-center ${isDarkMode ? 'border-slate-700' : 'border-slate-100'}`}>
                                        <div className="flex items-center gap-2.5">
                                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-500 text-white flex items-center justify-center font-bold shadow-md">
                                                <i className="fa-solid fa-hand-holding-medical text-lg"></i>
                                            </div>
                                            <div>
                                                <h2 className="font-bold text-sm bg-gradient-to-r from-teal-600 to-emerald-500 bg-clip-text text-transparent">Ritma Care Admin</h2>
                                                <p className="text-[10px] text-teal-600 dark:text-teal-400 font-semibold">Asrama Terpadu B, C & D</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setIsDrawerOpen(false)}

                        roomSick++;
                    }
                    if (mhs.status === "Sakit Parah") {
                        totalParah++;
                    }
                });

                const bldg = room.building;
                if (buildingSickCounts[bldg] !== undefined) {
                    buildingSickCounts[bldg] += roomSick;
                }
            });

            const totalObatPutra = medicines.filter(m => m.category === "Apotek Putra").reduce((acc, curr) => acc + curr.stock, 0);
            const totalObatPutri = medicines.filter(m => m.category === "Apotek Putri").reduce((acc, curr) => acc + curr.stock, 0);
            const pendingRequestsCount = requests.filter(r => r.status === "Menunggu").length;

            useEffect(() => {
                if (window.Chart) {
                    const textColor = isDarkMode ? '#cbd5e1' : '#475569';
                    const gridColor = isDarkMode ? '#334155' : '#f1f5f9';

                    if (donutChartRef.current) {
                        if (donutInstance.current) donutInstance.current.destroy();

                        const bldgLabels = ["Gedung B", "Gedung C", "Gedung D"];
                        const bldgValues = [buildingSickCounts["Gedung B"], buildingSickCounts["Gedung C"], buildingSickCounts["Gedung D"]];
                        const totalCases = bldgValues.reduce((a, b) => a + b, 0);
                        const bldgColors = ['#0d9488', '#ec4899', '#6366f1'];
                        const chartDataValues = totalCases > 0 ? bldgValues : [1, 1, 1];

                        const ctx = donutChartRef.current.getContext('2d');
                        donutInstance.current = new window.Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: bldgLabels,
                                datasets: [{
                                    data: chartDataValues,
                                    backgroundColor: bldgColors,
                                    hoverBackgroundColor: ['#0f766e', '#db2777', '#4f46e5'],
                                    borderWidth: 2,
                                    borderColor: isDarkMode ? '#1e293b' : '#ffffff'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { 
                                        position: 'bottom', 
                                        labels: { 
                                            boxWidth: 10, 
                                            color: textColor, 
                                            font: { size: 10, weight: 'bold' },
                                            generateLabels: function(chart) {
                                                return bldgLabels.map((lbl, idx) => {
                                                    const count = bldgValues[idx];
                                                    const pct = totalCases > 0 ? ((count / totalCases) * 100).toFixed(1) + "%" : "0%";
                                                    return {
                                                        text: `${lbl} (${pct})`,
                                                        fillStyle: bldgColors[idx],
                                                        strokeStyle: bldgColors[idx],
                                                        hidden: false,
                                                        index: idx
                                                    };
                                                });
                                            }
                                        } 
                                    },
                                    tooltip: {
                                        callbacks: {
                                            label: function(context) {
                                                const idx = context.dataIndex;
                                                const count = bldgValues[idx];
                                                const pct = totalCases > 0 ? ((count / totalCases) * 100).toFixed(1) + "%" : "0%";
                                                return `${bldgLabels[idx]}: ${count} Kasus Sakit (${pct})`;
                                            }
                                        }
                                    }
                                },
                                cutout: '68%'
                            }
                        });
                    }

                    if (barChartRef.current) {
                        if (barInstance.current) barInstance.current.destroy();

                        const filteredMeds = medicines.filter(m => m.category === `Apotek ${sector}`).slice(0, 5);
                        const ctx = barChartRef.current.getContext('2d');

                        barInstance.current = new window.Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: filteredMeds.map(m => m.name.length > 10 ? m.name.substring(0, 10) + '...' : m.name),
                                datasets: [{
                                    label: 'Stok Obat',
                                    data: filteredMeds.map(m => m.stock),
                                    backgroundColor: sector === 'Putra' ? '#6366f1' : '#ec4899',
                                    borderRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
                                    x: { grid: { display: false }, ticks: { color: textColor, font: { size: 9 } } }
                                }
                            }
                        });
                    }
                }

                return () => {
                    if (donutInstance.current) donutInstance.current.destroy();
                    if (barInstance.current) barInstance.current.destroy();
                };
            }, [sector, rooms, medicines, isDarkMode, buildingSickCounts]);

            const totalSickCount = buildingSickCounts["Gedung B"] + buildingSickCounts["Gedung C"] + buildingSickCounts["Gedung D"];
            const calcPct = (val) => totalSickCount > 0 ? ((val / totalSickCount) * 100).toFixed(1) + "%" : "0%";

            return (
                <div className="space-y-4 sm:space-y-6">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
                        <div className={`p-3 sm:p-4 rounded-2xl border shadow-sm flex items-center justify-between transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div>
                                <p className={`text-[11px] sm:text-xs font-semibold ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Mahasantri</p>
                                <p className="text-xl sm:text-2xl font-black mt-0.5">{totalMahasantri} <span className="text-[10px] sm:text-xs font-medium text-slate-400">({totalKamar} Kmr)</span></p>
                            </div>
                            <div className="w-9 h-9 sm:w-11 sm:h-11 bg-teal-500/10 text-teal-500 rounded-xl sm:rounded-2xl flex items-center justify-center text-sm sm:text-lg">
                                <i className="fa-solid fa-users"></i>
                            </div>
                        </div>

                        <div className={`p-3 sm:p-4 rounded-2xl border shadow-sm flex items-center justify-between transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div>
                                <p className={`text-[11px] sm:text-xs font-semibold ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Santri Sakit</p>
                                <p className="text-xl sm:text-2xl font-black text-amber-500 mt-0.5">{totalSakit} <span className="text-[10px] sm:text-xs font-semibold text-red-500">({totalParah} Parah)</span></p>
                            </div>
                            <div className="w-9 h-9 sm:w-11 sm:h-11 bg-amber-500/10 text-amber-500 rounded-xl sm:rounded-2xl flex items-center justify-center text-sm sm:text-lg">
                                <i className="fa-solid fa-bed-pulse"></i>
                            </div>
                        </div>

                        <div 
                            onClick={() => setCurrentView("requests")}
                            className={`p-3 sm:p-4 rounded-2xl border shadow-sm flex items-center justify-between transition-colors cursor-pointer active:scale-95 ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div>
                                <p className={`text-[11px] sm:text-xs font-semibold ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Permintaan Obat</p>
                                <p className="text-xl sm:text-2xl font-black text-indigo-400 mt-0.5">{pendingRequestsCount} <span className="text-[10px] text-amber-400 font-bold">Pending</span></p>
                            </div>
                            <div className="w-9 h-9 sm:w-11 sm:h-11 bg-indigo-500/10 text-indigo-500 rounded-xl sm:rounded-2xl flex items-center justify-center text-sm sm:text-lg">
                                <i className="fa-solid fa-hand-holding-medical"></i>
                            </div>
                        </div>

                        <div className={`p-3 sm:p-4 rounded-2xl border shadow-sm flex items-center justify-between transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div>
                                <p className={`text-[11px] sm:text-xs font-semibold ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Stok Obat PA/PI</p>
                                <p className="text-xl sm:text-2xl font-black text-emerald-500 mt-0.5">{totalObatPutra} / {totalObatPutri}</p>
                            </div>
                            <div className="w-9 h-9 sm:w-11 sm:h-11 bg-pink-500/10 text-pink-500 rounded-xl sm:rounded-2xl flex items-center justify-center text-sm sm:text-lg">
                                <i className="fa-solid fa-pills"></i>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                        <div className={`p-4 sm:p-5 rounded-3xl border shadow-sm space-y-3 sm:space-y-4 transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div>
                                <h3 className="font-bold text-sm sm:text-base">Rekap Sakit per Gedung</h3>
                                <p className={`text-[11px] sm:text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Monitoring kesehatan asrama Gedung B, C, dan D</p>
                            </div>

                            <div className="chart-container">
                                <canvas ref={donutChartRef}></canvas>
                            </div>

                            <div className="grid grid-cols-3 gap-1.5 sm:gap-2 pt-2 border-t dark:border-slate-700">
                                <div className={`p-2 sm:p-2.5 rounded-xl sm:rounded-2xl text-center ${isDarkMode ? 'bg-slate-900/60' : 'bg-slate-50'}`}>
                                    <span className="text-[9px] sm:text-[10px] font-bold text-teal-500 uppercase block truncate">Gedung B (PA)</span>
                                    <p className="text-sm sm:text-base font-extrabold mt-0.5">{calcPct(buildingSickCounts["Gedung B"])}</p>
                                    <span className="text-[9px] sm:text-[10px] text-slate-400 block truncate">{buildingSickCounts["Gedung B"]} Santri</span>
                                </div>
                                <div className={`p-2 sm:p-2.5 rounded-xl sm:rounded-2xl text-center ${isDarkMode ? 'bg-slate-900/60' : 'bg-slate-50'}`}>
                                    <span className="text-[9px] sm:text-[10px] font-bold text-pink-500 uppercase block truncate">Gedung C (PI)</span>
                                    <p className="text-sm sm:text-base font-extrabold mt-0.5">{calcPct(buildingSickCounts["Gedung C"])}</p>
                                    <span className="text-[9px] sm:text-[10px] text-slate-400 block truncate">{buildingSickCounts["Gedung C"]} Santri</span>
                                </div>
                                <div className={`p-2 sm:p-2.5 rounded-xl sm:rounded-2xl text-center ${isDarkMode ? 'bg-slate-900/60' : 'bg-slate-50'}`}>
                                    <span className="text-[9px] sm:text-[10px] font-bold text-indigo-500 uppercase block truncate">Gedung D (PA)</span>
                                    <p className="text-sm sm:text-base font-extrabold mt-0.5">{calcPct(buildingSickCounts["Gedung D"])}</p>
                                    <span className="text-[9px] sm:text-[10px] text-slate-400 block truncate">{buildingSickCounts["Gedung D"]} Santri</span>
                                </div>
                            </div>
                        </div>

                        <div className={`p-4 sm:p-5 rounded-3xl border shadow-sm space-y-3 sm:space-y-4 transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="font-bold text-sm sm:text-base">Stok Apotek Sektor</h3>
                                    <p className={`text-[11px] sm:text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>Inventaris sediaan poskes</p>
                                </div>

                                <div className={`p-1 rounded-xl flex gap-1 text-xs ${isDarkMode ? 'bg-slate-900' : 'bg-slate-100'}`}>
                                    <button 
                                        onClick={() => setSector("Putra")}
                                        className={`px-2.5 py-1 rounded-lg font-bold transition active:scale-95 ${sector === 'Putra' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400'}`}>
                                        Putra
                                    </button>
                                    <button 
                                        onClick={() => setSector("Putri")}
                                        className={`px-2.5 py-1 rounded-lg font-bold transition active:scale-95 ${sector === 'Putri' ? 'bg-pink-600 text-white shadow-sm' : 'text-slate-400'}`}>
                                        Putri
                                    </button>
                                </div>
                            </div>

                            <div className="chart-container">
                                <canvas ref={barChartRef}></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CekmarView({ rooms, setRooms, onEditMahasantri, onDeleteMahasantri, onResetAllToHealthy, showToast, isDarkMode }) {
            const [selectedBuilding, setSelectedBuilding] = useState("Semua");
            const [searchTerm, setSearchTerm] = useState("");
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingMhsContext, setEditingMhsContext] = useState(null);
            const [quickStatusRoom, setQuickStatusRoom] = useState(null);
            const [editingRoomContext, setEditingRoomContext] = useState(null);

            const [building, setBuilding] = useState("Gedung B");
            const [roomNo, setRoomNo] = useState("");
            const [mhsName, setMhsName] = useState("");
            const [nim, setNim] = useState("");
            const [major, setMajor] = useState("Teknik Informatika");
            const [semester, setSemester] = useState("");
            const [status, setStatus] = useState("Sehat");
            const [symptom, setSymptom] = useState("");

            const handleUpdateQuickStatus = (roomId, mhsId, newStatus) => {
                const updated = rooms.map(room => {
                    if (room.id === roomId) {
                        const updatedOccupants = room.occupants.map(mhs => {
                            if (mhs.id === mhsId) {
                                return { 
                                    ...mhs, 
                                    status: newStatus, 
                                    symptom: newStatus === 'Sehat' ? '-' : (mhs.symptom && mhs.symptom !== '-' ? mhs.symptom : 'Demam & Flu') 
                                };
                            }
                            return mhs;
                        });
                        return { ...room, occupants: updatedOccupants };
                    }
                    return room;
                });
                setRooms(updated);
                showToast(`Status kesehatan diperbarui menjadi ${newStatus}`);
            };

            const handleAddCekmarRecord = (e) => {
                e.preventDefault();
                if (!roomNo || !mhsName) return;

                const targetRoomId = `RM-${building.replace('Gedung ', '')}${roomNo}`;
                const sector = getSectorByBuilding(building);
                const existingRoom = rooms.find(r => r.id === targetRoomId || (r.building === building && r.roomNo === roomNo));

                const newMhs = {
                    id: `MHS-${Math.floor(100 + Math.random() * 900)}`,
                    nim: nim || `26010${Math.floor(1000 + Math.random() * 9000)}`,
                    name: mhsName,
                    major: major || "Umum",
                    semester: semester || "Semester 1",
                    status,
                    symptom: symptom || "-"
                };

                if (existingRoom) {
                    const updated = rooms.map(r => r.id === existingRoom.id ? { ...r, occupants: [...r.occupants, newMhs] } : r);
                    setRooms(updated);
                } else {
                    const newRoom = {
                        id: targetRoomId,
                        building,
                        roomNo,
                        sector,
                        occupants: [newMhs]
                    };
                    setRooms([newRoom, ...rooms]);
                }

                showToast(`Data mahasantri ${mhsName} berhasil disimpan!`);
                setMhsName("");
                setNim("");
                setRoomNo("");
                setSemester("");
                setSymptom("");
                setShowAddModal(false);
            };

            const handleSaveMhsEdit = (e) => {
                e.preventDefault();
                if (!editingMhsContext) return;
                const { mhs, room, form } = editingMhsContext;
                const sector = getSectorByBuilding(form.building);

                onEditMahasantri(
                    mhs.id, 
                    room.id, 
                    {
                        name: form.name,
                        nim: form.nim,
                        major: form.major,
                        semester: form.semester,
                        status: form.status,
                        symptom: form.symptom || "-"
                    },
                    form.building,
                    form.roomNo,
                    sector
                );
                setEditingMhsContext(null);
            };

            const handleSaveRoomEdit = (e) => {
                e.preventDefault();
                if (!editingRoomContext) return;
                const { originalRoom, newBuilding, newRoomNo } = editingRoomContext;
                const newSector = getSectorByBuilding(newBuilding);
                const newId = `RM-${newBuilding.replace('Gedung ', '')}${newRoomNo}`;

                setRooms(rooms.map(r => {
                    if (r.id === originalRoom.id) {
                        return {
                            ...r,
                            id: newId,
                            building: newBuilding,
                            roomNo: newRoomNo,
                            sector: newSector
                        };
                    }
                    return r;
                }));
                showToast(`Nomor kamar berhasil diubah menjadi ${newBuilding} - Kamar ${newRoomNo}`);
                setEditingRoomContext(null);
            };

            const filteredRooms = rooms.filter(room => {
                const matchBuilding = selectedBuilding === "Semua" || room.building === selectedBuilding;
                const matchSearch = room.roomNo.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    room.building.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    room.occupants.some(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()) || (m.nim && m.nim.includes(searchTerm)));
                return matchBuilding && matchSearch;
            });

            return (
                <div className="space-y-4 sm:space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pb-2 border-b dark:border-slate-800">
                        <div>
                            <div className="flex items-center gap-2">
                                <h2 className="text-xl sm:text-2xl font-black tracking-tight">Daftar Kamar Asrama</h2>
                                <span className="bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-bold px-2 py-0.5 rounded-lg text-xs">
                                    {filteredRooms.length} Kamar
                                </span>
                            </div>
                            <p className={`text-xs mt-0.5 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                                Gedung B, C & D · Seluruh data kamar dan mahasantri dapat diedit langsung.
                            </p>
                        </div>

                        <div className="flex items-center gap-3 text-xs font-semibold">
                            <div className="flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span className={isDarkMode ? 'text-slate-300' : 'text-slate-600'}>Sehat</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                                <span className={isDarkMode ? 'text-slate-300' : 'text-slate-600'}>Sakit</span>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-2.5">
                        <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                            {["Semua", "Gedung B", "Gedung C", "Gedung D"].map(bld => (
                                <button 
                                    key={bld}
                                    onClick={() => setSelectedBuilding(bld)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap active:scale-95 ${
                                        selectedBuilding === bld 
                                            ? 'bg-teal-600 text-white shadow-sm' 
                                            : isDarkMode 
                                                ? 'bg-slate-800 text-slate-300' 
                                                : 'bg-white text-slate-700 border border-slate-200'
                                    }`}>
                                    {bld} {bld !== "Semua" ? (bld === "Gedung C" ? "(PI)" : "(PA)") : ""}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-col sm:flex-row items-center gap-2">
                            <div className="relative w-full sm:flex-1">
                                <i className="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-xs"></i>
                                <input 
                                    type="text"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder="Cari kamar / nama / NIM..."
                                    className={`w-full pl-8 pr-3 py-2 border rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-teal-500 ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200'}`}
                                />
                            </div>

                            <div className="flex items-center gap-2 w-full sm:w-auto">
                                <button 
                                    onClick={onResetAllToHealthy}
                                    className="flex-1 sm:flex-initial px-3 py-2 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-600 text-emerald-600 dark:text-emerald-400 hover:text-white border border-emerald-200 dark:border-emerald-800/60 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 active:scale-95"
                                    title="Setel semua mahasantri menjadi Sehat">
                                    <i className="fa-solid fa-heart-circle-check"></i>
                                    <span>Semua Sehat</span>
                                </button>

                                <button 
                                    onClick={() => setShowAddModal(true)}
                                    className="flex-1 sm:flex-initial px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-1.5 active:scale-95">
                                    <i className="fa-solid fa-plus"></i>
                                    <span>Tambah</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                        {filteredRooms.map(room => {
                            const sickOccupants = room.occupants.filter(o => o.status !== "Sehat");
                            const hasSevereSick = room.occupants.some(o => o.status === "Sakit Parah");
                            const totalOccupants = room.occupants.length;
                            const floorNumber = room.roomNo.startsWith("2") ? "2" : "1";

                            return (
                                <div 
                                    key={room.id} 
                                    className={`rounded-3xl border shadow-sm p-4 sm:p-6 space-y-3.5 sm:space-y-4 transition duration-200 ${
                                        isDarkMode 
                                            ? 'bg-slate-800/90 border-slate-700' 
                                            : 'bg-white border-slate-100 hover:shadow-md'
                                    }`}>
                                    
                                    <div className="flex justify-between items-start gap-2 border-b pb-3 dark:border-slate-700/60">
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <h3 className="text-lg sm:text-xl font-black tracking-tight">
                                                    Kamar {room.roomNo}
                                                </h3>
                                                <button 
                                                    onClick={() => setEditingRoomContext({
                                                        originalRoom: room,
                                                        newBuilding: room.building,
                                                        newRoomNo: room.roomNo
                                                    })}
                                                    className="w-6 h-6 rounded-lg text-slate-400 hover:text-teal-500 hover:bg-teal-500/10 flex items-center justify-center text-xs transition active:scale-90"
                                                    title="Edit Kamar">
                                                    <i className="fa-solid fa-pen"></i>
                                                </button>
                                            </div>
                                            
                                            <div className="flex items-center gap-1.5 mt-0.5 text-xs">
                                                <span className={`font-bold px-1.5 py-0.5 rounded text-[10px] tracking-wide uppercase ${
                                                    isDarkMode ? 'bg-slate-700 text-slate-300' : 'bg-slate-100 text-slate-600'
                                                }`}>
                                                    LT. {floorNumber} • {room.building.toUpperCase()} ({room.sector.toUpperCase()})
                                                </span>
                                                <span className="text-slate-400 font-medium text-[10px]">
                                                    {totalOccupants} MHS
                                                </span>
                                            </div>
                                        </div>

                                        <div className="text-right shrink-0">
                                            {hasSevereSick ? (
                                                <div className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-red-600 text-white shadow-sm animate-pulse">
                                                    <i className="fa-solid fa-square-plus text-[10px]"></i>
                                                    <span>Poskestren</span>

                        <div>
                            <div className="flex items-center gap-2">
                                <span className="bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded-lg text-xs">ORKES STAFF</span>
                                <h2 className="text-lg sm:text-xl font-bold">Jadwal Tim ORKES</h2>
                            </div>
                            <p className={`text-xs mt-0.5 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                                Petugas kesehatan piket & shift asrama.
                            </p>
                        </div>

                        <button 
                            onClick={() => setShowStaffModal(true)}
                            className="w-full sm:w-auto px-3.5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow transition flex items-center justify-center gap-1.5 active:scale-95">
                            <i className="fa-solid fa-plus-circle"></i>
                            <span>Tambah Anggota</span>
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5">
                        {staff.map(st => (
                            <div key={st.id} className={`p-3.5 sm:p-5 rounded-3xl border shadow-sm flex items-start gap-3 transition ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-white text-lg font-bold shadow-md shrink-0 ${st.avatarBg || 'bg-teal-600'}`}>
                                    <i className="fa-solid fa-user-doctor"></i>
                                </div>
                                <div className="space-y-1 flex-1 min-w-0">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-teal-500/10 text-teal-400 border border-teal-500/20">
                                            Sektor {st.sector}
                                        </span>
                                        <div className="flex items-center gap-1">
                                            <button 
                                                onClick={() => setEditingStaff({ ...st })}
                                                className="w-6 h-6 rounded-md bg-blue-500/10 text-blue-500 flex items-center justify-center text-xs active:scale-90"
                                                title="Edit">
                                                <i className="fa-solid fa-pen"></i>
                                            </button>
                                            <button 
                                                onClick={() => onDeleteStaff(st.id, st.name)}
                                                className="w-6 h-6 rounded-md bg-red-500/10 text-red-500 flex items-center justify-center text-xs active:scale-90"
                                                title="Hapus">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <h4 className="font-bold text-xs sm:text-sm leading-tight truncate">{st.name}</h4>
                                    <p className={`text-[11px] truncate ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>{st.role}</p>
                                    <p className="text-[10px] text-teal-500 font-semibold truncate"><i className="fa-solid fa-clock me-1"></i> {st.shift}</p>
                                    <a href={`tel:${st.phone}`} className="text-[10px] text-slate-400 hover:text-teal-500 block truncate"><i className="fa-solid fa-phone me-1"></i> {st.phone}</a>
                                </div>
                            </div>
                        ))}
                    </div>

                    {editingStaff && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setEditingStaff(null)}></div>
                            <div className={`relative w-full max-w-md p-4 sm:p-6 rounded-3xl shadow-2xl z-10 space-y-3.5 max-h-[90vh] overflow-y-auto ${isDarkMode ? 'bg-slate-800 border border-slate-700 text-slate-100' : 'bg-white text-slate-800'}`}>
                                <div className="flex justify-between items-center border-b pb-2.5 dark:border-slate-700">
                                    <h3 className="font-bold text-sm sm:text-base">Edit Petugas ORKES</h3>
                                    <button onClick={() => setEditingStaff(null)} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveEditStaff} className="space-y-3 text-xs">
                                    <div>
                                        <label className="font-bold text-slate-400 uppercase">Nama Lengkap</label>
                                        <input 
                                            type="text" 
                                            value={editingStaff.name} 
                                            onChange={(e) => setEditingStaff({ ...editingStaff, name: e.target.value })} 
                                            required 
                                            className={`w-full p-2.5 border rounded-xl font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} 
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="font-bold text-slate-400 uppercase">Peran / Jabatan</label>
                                            <input 
                                                type="text" 
                                                value={editingStaff.role} 
                                                onChange={(e) => setEditingStaff({ ...editingStaff, role: e.target.value })} 
                                                required 
                                                className={`w-full p-2.5 border rounded-xl font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} 
                                            />
                                        </div>
                                        <div>
                                            <label className="font-bold text-slate-400 uppercase">Sektor</label>
                                            <select 
                                                value={editingStaff.sector} 
                                                onChange={(e) => setEditingStaff({ 
                                                    ...editingStaff, 
                                                    sector: e.target.value,
                                                    avatarBg: e.target.value === 'Putri' ? 'bg-pink-600' : 'bg-teal-600'
                                                })} 
                                                className={`w-full p-2.5 border rounded-xl font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`}>
                                                <option value="Putra">Putra</option>
                                                <option value="Putri">Putri</option>
                                                <option value="Semua">Semua</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="font-bold text-slate-400 uppercase">Shift Piket</label>
                                        <input 
                                            type="text" 
                                            value={editingStaff.shift} 
                                            onChange={(e) => setEditingStaff({ ...editingStaff, shift: e.target.value })} 
                                            required 
                                            className={`w-full p-2.5 border rounded-xl font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} 
                                        />
                                    </div>

                                    <div>
                                        <label className="font-bold text-slate-400 uppercase">Telepon / WhatsApp</label>
                                        <input 
                                            type="text" 
                                            value={editingStaff.phone} 
                                            onChange={(e) => setEditingStaff({ ...editingStaff, phone: e.target.value })} 
                                            className={`w-full p-2.5 border rounded-xl font-semibold ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} 
                                        />
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setEditingStaff(null)} className="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 font-bold rounded-xl active:scale-95">Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 text-white font-bold rounded-xl shadow active:scale-95">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showStaffModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm" onClick={() => setShowStaffModal(false)}></div>
                            <div className={`relative w-full max-w-md p-4 sm:p-6 rounded-3xl shadow-2xl z-10 space-y-3.5 ${isDarkMode ? 'bg-slate-800 border border-slate-700 text-slate-100' : 'bg-white text-slate-800'}`}>
                                <div className="flex justify-between items-center border-b pb-2.5 dark:border-slate-700">
                                    <h3 className="font-bold text-sm sm:text-base">Tambah Anggota ORKES</h3>
                                    <button onClick={() => setShowStaffModal(false)} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleAddStaff} className="space-y-3 text-xs">
                                    <div>
                                        <label className="font-bold text-slate-500">Nama Lengkap</label>
                                        <input type="text" value={name} onChange={(e) => setName(e.target.value)} required placeholder="Ahmad Fauzi" className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="font-bold text-slate-500">Jabatan</label>
                                            <input type="text" value={role} onChange={(e) => setRole(e.target.value)} required placeholder="Tim Poskes" className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} />
                                        </div>
                                        <div>
                                            <label className="font-bold text-slate-500">Sektor</label>
                                            <select value={sector} onChange={(e) => setSector(e.target.value)} className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`}>
                                                <option value="Putra">Putra</option>
                                                <option value="Putri">Putri</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-500">Shift</label>
                                        <input type="text" value={shift} onChange={(e) => setShift(e.target.value)} required placeholder="Shift Pagi (07.00 - 15.00)" className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-400">No. WhatsApp</label>
                                        <input type="text" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="0812-3456-7890" className={`w-full p-2.5 border rounded-xl ${isDarkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white'}`} />
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowStaffModal(false)} className="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 font-bold rounded-xl active:scale-95">Batal</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-teal-600 text-white font-bold rounded-xl active:scale-95">Simpan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
